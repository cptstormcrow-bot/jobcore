<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <desc>jobcore icon side</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:source>Codespace/SDAssemblyPros/Jobcore/assets/branding/jobcore-icon-side.svg</dc:source>
        <dc:subject>sdassemblypros, jobcore</dc:subject>
      </rdf:Description>
    </rdf:RDF>
  </metadata>
  <title>JobCore hard hat, side view</title>
  <defs>
    <linearGradient id="dome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFB03A"/>
      <stop offset="0.35" stop-color="#FF8A00"/>
      <stop offset="0.8" stop-color="#F26200"/>
      <stop offset="1" stop-color="#C94700"/>
    </linearGradient>
    <linearGradient id="hshade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A2A00" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#7A2A00" stop-opacity="0"/>
      <stop offset="0.8" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#7A2A00" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A1F"/>
      <stop offset="0.5" stop-color="#F26A00"/>
      <stop offset="1" stop-color="#B83F00"/>
    </linearGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC25A"/>
      <stop offset="1" stop-color="#F57000"/>
    </linearGradient>
    <linearGradient id="jface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D8D8D8"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <!-- contact shadow -->
  <ellipse cx="270" cy="392" rx="215" ry="14" fill="#000000" opacity="0.25" filter="url(#soft)"/>
  <!-- brim underside (peak extends to the right) -->
  <path d="M96 346 L452 346 C480 348 500 358 506 372 C470 392 300 398 150 390 C110 386 92 366 96 346 Z" fill="#A83A00" stroke="#8A2F00" stroke-width="4" stroke-linejoin="round"/>
  <!-- brim top -->
  <path d="M84 336 L452 336 C482 338 502 350 506 366 C470 380 300 384 140 378 C98 374 76 356 84 336 Z" fill="url(#brim)" stroke="#B84300" stroke-width="4" stroke-linejoin="round"/>
  <path d="M110 346 C220 362 380 362 488 358" fill="none" stroke="#FFD08A" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <!-- dome -->
  <path d="M92 340 C84 200 170 104 292 104 C396 104 456 186 462 340 Z" fill="url(#dome)" stroke="#B84300" stroke-width="5" stroke-linejoin="round"/>
  <path d="M92 340 C84 200 170 104 292 104 C396 104 456 186 462 340 Z" fill="url(#hshade)"/>
  <!-- centre ridge running front to back -->
  <path d="M130 330 C128 210 190 128 292 126 C380 126 430 200 436 330 L402 330 C398 226 362 160 292 160 C222 162 168 226 164 330 Z" fill="url(#ridge)" stroke="#C24B00" stroke-width="3" stroke-linejoin="round"/>
  <!-- specular highlight -->
  <ellipse cx="230" cy="168" rx="70" ry="22" transform="rotate(-18 230 168)" fill="url(#shine)"/>
  <path d="M168 200 C190 160 230 140 280 138" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
  <!-- front band at dome base -->
  <path d="M92 318 L462 318 L462 340 L92 340 Z" fill="#D94F00" opacity="0.55"/>
  <!-- J on the side of the dome -->
  <g transform="translate(282 238) scale(0.85) translate(-254 -228)">
    <path d="M236 150 L322 150 L322 232 C322 278 294 306 252 306 C216 306 192 286 186 256 L232 246 C236 260 244 266 252 266 C260 266 266 258 266 238 L266 178 L236 178 Z" transform="translate(5 7)" fill="#5A1E00" opacity="0.55" filter="url(#drop)"/>
    <path d="M236 150 L322 150 L322 232 C322 278 294 306 252 306 C216 306 192 286 186 256 L232 246 C236 260 244 266 252 266 C260 266 266 258 266 238 L266 178 L236 178 Z" fill="url(#jface)" stroke="#9A3500" stroke-width="5" stroke-linejoin="round"/>
    <path d="M240 156 L316 156" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
  <!-- rim light on the front -->
  <path d="M440 200 C452 240 458 290 458 330" fill="none" stroke="#FFC878" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
